aid: smallstep
name: SmallStep
description: >-
  Smallstep operates the world's first Device Identity Platform. It issues hardware-backed, short-lived
  X.509 and SSH certificates that cryptographically prove what is acting and from where — for devices,
  humans, workloads, AI agents, and MCP toolchains. Smallstep co-developed ACME Device Attestation
  (ACME DA) with Google through the IETF, using TPM and Secure Enclave co-processors to bind
  non-exportable credentials to specific devices at issuance. Its OpenAPI-conformant Platform API
  (gateway.smallstep.com) manages device inventory, PKI (certificate authorities and provisioners),
  certificate issuance and revocation, credentials, and protected resources such as Wi-Fi, VPN, and SSO.
  Smallstep also maintains the widely used open-source step CLI and step-ca certificate authority.
