            - dns-01
            - tls-alpn-01
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        forceCN:
          description: Force one of the SANs to become the Common Name, if a Common Name is not provided.
          type: boolean
        requireEAB:
          description: Only ACME clients that have been preconfigured with valid EAB credentials will be able to create an account with this provisioner. Must be `true` for all new provisioners.
          type: boolean
      required:
      - challenges
      - requireEAB
      title: ACME Provisioner
      type: object
    nameConstraints:
      description: X.509 certificate name constraints.
      properties:
        critical:
          description: 'Whether or not name constraints are marked critical.

